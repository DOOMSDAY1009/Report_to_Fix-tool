g/1998/Math/MathML\"><mi>F<\/mi><mo>=<\/mo><mi>q<\/mi><mi>E<\/mi><\/math><\/h3>\n", "answer": ["A, B, D"]}, "reports": [{"reportId": "R020", "comment": "I marked A B D and still got it wrong", "source": "web", "flags": null}]}, {"id": "68f21caf941cda588bc04365", "subject": "Physics", "chapter": "Mathematics in physics", "verdict": "defect", "repair": "type_mismatch", "route": "auto_apply", "conf": 0.95, "evidence": "Asks for one number. N/N0 = 6/48 = 1/8 = 3 half-lives in 3 min so T½ = 1 min, tau = 1/0.693 = 1.44 min = B only. Stored as mcq with key ['', 'B'] (empty entry). Should be scq with key B.", "reply": "You’re right: it has one correct answer (B, 1.44 min) but was stored as multiple-correct. We’ve changed it to single-correct, so the negative marking was unfair.", "priority": 80.0, "edits": [{"field": "questionType", "find": "mcq", "replace": "scq"}, {"field": "answer", "find": "[\"\", \"B\"]", "replace": "B"}], "guard": [], "side": [], "flags": false, "q": {"type": "mcq", "question": "<h3>A sample of nuclei X contains <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn> 48 <\/mn><mi>&times;<\/mi><msup><mn> 10 <\/mn><mrow><mn> 23 <\/mn><\/mrow><\/msup><\/mrow><\/math> nuclei at some time and reduced to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn> 6 <\/mn><mi>&times;<\/mi><msup><mn> 10 <\/mn><mrow><mn> 23 <\/mn><\/mrow><\/msup><\/mrow><\/math> nuclei in 3 minutes. The mean life of nucleus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi> X <\/mi><\/mrow><\/math> is roughly?<br />\n(A) 0.693 min<br />\n(B) 1.44 min<br />\n(C) 2.079 min<br />\n(D) 4.329 min&nbsp;<\/h3>\n", "solution": "<p>A sample of nuclei decreases from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mn>48<\/mn><mo>&times;<\/mo><msup><mn>10<\/mn><mn>23<\/mn><\/msup> <\/math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mn>6<\/mn><mo>&times;<\/mo><msup><mn>10<\/mn><mn>23<\/mn><\/msup> <\/math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3<\/mn><\/math> minutes.<\/p>\n\n<p>Radioactive decay law: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>N<\/mi> <mo>=<\/mo> <msub><mi>N<\/mi><mn>0<\/mn><\/msub> <msup> <mi>e<\/mi> <mrow> <mo>&minus;<\/mo> <mfrac> <mi>t<\/mi> <mi>&tau;<\/mi> <\/mfrac> <\/mrow> <\/msup> <\/math><\/p>\n\n<p>Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mfrac> <mi>N<\/mi> <msub><mi>N<\/mi><mn>0<\/mn><\/msub> <\/mfrac> <mo>=<\/mo> <mfrac><mn>6<\/mn><mn>48<\/mn><\/mfrac> <mo>=<\/mo> <mfrac><mn>1<\/mn><mn>8<\/mn><\/mfrac> <\/math> so <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mfrac> <mi>N<\/mi> <msub><mi>N<\/mi><mn>0<\/mn><\/msub> <\/mfrac> <mo>=<\/mo> <msup> <mi>e<\/mi> <mrow> <mo>&minus;<\/mo> <mfrac> <mi>t<\/mi> <mi>&tau;<\/mi> <\/mfrac> <\/mrow> <\/msup> <mo>=<\/mo> <mfrac><mn>1<\/mn><mn>8<\/mn><\/mfrac> <\/math><\/p>\n\n<p>Taking natural logarithm: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>ln<\/mi> <mo stretchy=\"false\">(<\/mo> <mfrac><mn>1<\/mn><mn>8<\/mn><\/mfrac> <mo stretchy=\"false\">)<\/mo> <mo>=<\/mo> <mo>&minus;<\/mo> <mfrac> <mi>t<\/mi> <mi>&tau;<\/mi> <\/mfrac> <\/math> so <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mfrac> <mi>t<\/mi> <mi>&tau;<\/mi> <\/mfrac> <mo>=<\/mo> <mi>ln<\/mi> <mo stretchy=\"false\">(<\/mo> <mn>8<\/mn> <mo stretchy=\"false\">)<\/mo> <\/math> and therefore <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>&tau;<\/mi> <mo>=<\/mo> <mfrac> <mi>t<\/mi> <mi>ln⁡(8)<\/mi> <\/mfrac> <\/math> .<\/p>\n\n<p>Since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>t<\/mi><mo>=<\/mo><mn>3<\/mn><mo>&nbsp;<\/mo><mi>min<\/mi> <\/math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>ln<\/mi> <mo stretchy=\"false\">(<\/mo> <mn>8<\/mn> <mo stretchy=\"false\">)<\/mo> <mo>=<\/mo> <mi>ln<\/mi> <mo stretchy=\"false\">(<\/mo> <msup><mn>2<\/mn><mn>3<\/mn><\/msup> <mo stretchy=\"false\">)<\/mo> <mo>=<\/mo> <mn>3<\/mn><mi>ln<\/mi> <mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo> <mo>&asymp;<\/mo> <mn>2.079<\/mn> <\/math> we get <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>&tau;<\/mi> <mo>=<\/mo> <mfrac> <mn>3<\/mn> <mn>2.079<\/mn> <\/mfrac> <mo>&asymp;<\/mo> <mn>1.44<\/mn><mo>&nbsp;<\/mo><mi>min<\/mi> <\/math> .<\/p>\n\n<p>Hence the mean life of the nucleus is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>&tau;<\/mi><mo>&asymp;<\/mo><mn>1.44<\/mn><mo>&nbsp;<\/mo><mi>min<\/mi> <\/math> .<\/p>\n", "answer": ["", "B"]}, "reports": [{"reportId": "R021", "comment": "only B is correct but its multiple correct type and I got negative", "source": "android", "flags": null}]}, {"id": "61ee6c9d90a1a968a168686b", "subject": "Zoology", "chapter": "Digestion and Absorption", "verdict": "defect", "repair": "spelling", "route": "auto_apply", "conf": 0.99, "evidence": "Option D 'Choroid plexux' should be 'plexus'. Letters-only fix.", "reply": "Thanks, you’re right: it’s now “Choroid plexus”.", "priority": 20.0, "edits": [{"field": "question", "find": "Choroid plexux", "replace": "Choroid plexus"}], "guard": [], "side": ["Solution typos: 'prominant' → 'prominent', 'Maceus' → 'Mucous'."], "flags": false, "q": {"type": "scq", "question": "<h3><span style=\"color:#000000\">Aggregates of lymphoid tissue present in the distal portion of the small intestine are known as<\/h3><h3>(A)<span style=\"color:#000000\"> <span style=\"color:#000000\">Villi<br />(B)<span style=\"color:#000000\"> <span style=\"color:#000000\">Peyer&rsquo;s patches<br />(C)<span style=\"color:#000000\"> <span style=\"color:#000000\">Rugae<br />(D)<\/span><\/span><\/span><span style=\"color:#000000\"> <\/span><\/span><\/span><span style=\"color:#000000\">Choroid plexux<\/span><\/span><\/span><\/h3>", "solution": "<h3><span style=\"color:#000000\">In the wall of small intestine, lymphatic tissues are present called Peyer&rsquo;s patches. These are groups of lymph nodules that are most numerous in the ileum. They produce lymphocytes.<br />\r\n<span style=\"color:#000000\">Rugae are prominant folds found in empty stomach. Maceus membrane of small intestine is grown into many finger-like projections known as villi.<\/span><\/span>​​​​​​​<\/h3>", "answer": "B"}, "reports": [{"reportId": "R022", "comment": "spelling of plexus wrong", "source": "android", "flags": null}]}, {"id": "68ecbacb2ec87a18deba1ad7", "subject": "Botany", "chapter": "The Living World", "verdict": "defect", "repair": "wrong_chapter", "route": "faculty_review", "conf": 0.95, "evidence": "Question is about absolute refractory period / voltage-gated Na+ channels: Neural Control and Coordination (Zoology). It is filed under Botany > The Living World.", "reply": "Agreed, this belongs under Neural Control and Coordination, not The Living World. Faculty will move it. Thanks!", "priority": 40.0, "edits": [], "guard": [], "side": [], "flags": false, "q": {"type": "scq", "question": "<h3>The absolute refractory period during an action potential generation is primarily caused by:<br />\n(A) Closure of voltage-gated K<sup>+<\/sup> channels.<br />\n(B) Inactivation of voltage-gated Na<sup>+&nbsp;<\/sup>channels.<br />\n(C) Increased permeability to Cl<sup>&minus;&nbsp;<\/sup>ions.<br />\n(D) Continuous activation of the Na<sup>+<\/sup>/K<sup>+&nbsp;<\/sup>pump.<\/h3>\n", "solution": "<h3>The absolute refractory period is the short interval immediately following the generation of an action potential during which the neuron is completely incapable of generating another action potential, regardless of the strength of the stimulus. This period is primarily due to the inactivation of the voltage-gated Na+channels. Although the membrane is depolarized (which would normally open them), these specific channels enter a temporary, locked inactivated state that prevents them from opening again, thereby halting the influx of Na+ ions required for a new depolarization.<\/h3>\n", "answer": "B"}, "reports": [{"reportId": "R023", "comment": "this is from neural control chapter, why is it in living world", "source": "android", "flags": null}]}, {"id": "5fc60508028950133eac8963", "subject": "Physics", "chapter": "Newton's law of motion", "verdict": "defect", "repair": "answer_form", "route": "auto_apply", "conf": 0.93, "evidence": "Integer question never states the unit. Solution works in newtons and ends at 20 N. Additive text only.", "reply": "Fair point, the unit was missing. The answer is in newtons (20 N). We’ve added “(in N)” to the question.", "priority": 40.0, "edits": [{"field": "question", "find": "frictional force is equal to<\/span>", "replace": "frictional force is equal to (in N)<\/span>"}], "guard": [], "side": [], "flags": false, "q": {"type": "integerQuestion", "question": "<h3><span style=\"color:#000000\">A body of mass 2 kg is kept by pressing to a vertical wall by a force of 100 N. The friction between wall and body is 0.3. Then the frictional force is equal to<\/span><\/h3>\n", "solution": "<h3>The maximum friction available to prevent sliding is given by:<br />\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f<\/mi><mrow><mi>m<\/mi><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msub><mo>=<\/mo><mi>&#956;<\/mi><mo>&#215;<\/mo><mi>N<\/mi><mo>=<\/mo><mn>0<\/mn><mo>.<\/mo><mn>3<\/mn><mo>&#215;<\/mo><mn>100<\/mn><mo>=<\/mo><mn>30<\/mn><mo>&#160;<\/mo><mi>N<\/mi><\/math><br />\nThe force pulling the body down is its&nbsp;weight,<br />\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W<\/mi><mo>=<\/mo><mi>m<\/mi><mi>g<\/mi><mo>=<\/mo><mn>2<\/mn><mo>&#215;<\/mo><mn>10<\/mn><mo>=<\/mo><mn>20<\/mn><mo>&#160;<\/mo><mi>N<\/mi><\/math><br />\nStatic friction is a self-adjusting force that only acts to balance the applied force, up to its maximum value. Since the weight (W = 20 N)&nbsp;is<strong>&nbsp;<\/strong>less&nbsp;than the maximum available friction (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f<\/mi><mrow><mi>m<\/mi><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>30<\/mn><mo>&#160;<\/mo><mi>N<\/mi><\/math>),&nbsp;the body remains at rest. Therefore, the actual frictional force is exactly equal to the weight.<br />\n​​​​​​​<\/h3>\n", "answer": "20"}, "reports": [{"reportId": "R024", "comment": "unit not mentioned in question", "source": "android", "flags": null}]}, {"id": "622df25ab70e4b50e44ff837", "subject": "Physics", "chapter": "Properties of matter and fluid mechanics", "verdict": "defect", "repair": "diagram", "route": "faculty_review", "conf": 0.9, "evidence": "Stem says 'as shown in figure' but quesImages is empty. Key B is plausible (smaller bubble has higher pressure, so air flows 1→2), but it depends on a figure we don’t have, which only a human can supply.", "reply": "You’re right, the figure is missing. Faculty will add it. Until then, think about which bubble has the higher pressure: that decides which way air flows.", "priority": 80.0, "edits": [], "guard": [], "side": [], "flags": false, "q": {"type": "scq", "question": "<h3>A glass tube of uniform internal radius (r) has a valve separating the two identical ends. Initially, the valve is in a tightly closed position. End 1 has a hemispherial soap bubble of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mstyle displaystyle=\"true\"><mrow><mi>r<\/mi><\/mrow><\/mstyle><\/math>. End 2 has sub-hemispherical soap bubble as shown in figure.<br/><br/>Just after opening the valve.<br/>(A) air from end 1 flows towards end 2 . No change in the volume of the soap bubbles<br/>(B) air from end 1 flows towards end 2. Volume of the soap bubble at end 1 decreases<br/>(C) no change occurs<br/>(D) air from end 2 flows towards end 1 . Volume of the soap bubble at end 1 increases<\/h3>", "solution": "<h3>Pressure inside tube <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mstyle displaystyle=\"true\"><mrow><mo>&#x0003D;<\/mo><mi>P<\/mi><mo>&#x0003D;<\/mo><msub><mi>P<\/mi><mrow><mn>0<\/mn><\/mrow><\/msub><mo>& : "Something is wrong with this question, though not quite as you said. At π/2 the intensity is 2I₀, so the assertion is false, and the reason is false too, so none of the options fits. Faculty will fix it.", "priority": 100.0, "edits": [], "guard": [], "side": [], "flags": false, "q": {"type": "scq", "question": "<h3>Assertion&nbsp;(A) : When two waves of equal amplitude and a phase difference of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle displaystyle=\"true\"><mrow><mfrac><mrow><mi>&pi;<\/mi><\/mrow><mrow><mn> 2 <\/mn><\/mrow><\/mfrac><\/mrow><\/mstyle><\/math> interfere, the resulting intensity is equal to the intensity of one wave.<br />\nReason (R): In interference, the resultant intensity is always the sum of individual intensities if the phase difference is non-zero.<br />\n<br />\n(A) Both A and R are true, and R is the correct explanation of A .<br />\n(B) Both A and R are true, but R is not the correct explanation of A .<br />\n(C) A is true, but R is false.<br />\n(D) A is false, but R is true.<\/h3>\n", "solution": "<h3>Assertion<br />\n(A) is false because when two waves of equal amplitude interfere with a phase difference of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle displaystyle=\"true\"><mrow><mfrac><mrow><mi>&pi;<\/mi><\/mrow><mrow><mn> 2 <\/mn><\/mrow><\/mfrac><\/mrow><\/mstyle><\/math>, the resultant intensity is not equal to the intensity of one wave. Instead, it is given by:<br />\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle displaystyle=\"true\"><mrow><mi> I <\/mi><mo>=<\/mo><mn> 2 <\/mn><msub><mi> I <\/mi><mrow><mn> 0 <\/mn><\/mrow><\/msub><msup><mi> cos <\/mi><mrow><mn> 2 <\/mn><\/mrow><\/msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mrow><mi>ϕ<\/mi><\/mrow><mrow><mn> 2 <\/mn><\/mrow><\/mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><\/mstyle><\/math><br />\nFor a phase difference of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle displaystyle=\"true\"><mrow><mfrac><mrow><mi>&pi;<\/mi><\/mrow><mrow><mn> 2 <\/mn><\/mrow><\/mfrac><\/mrow><\/mstyle><\/math>, this formula gives:<br />\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle displaystyle=\"true\"><mrow><mi> I <\/mi><mo>=<\/mo><mn> 2 <\/mn><msub><mi> I <\/mi><mrow><mn> 0 <\/mn><\/mrow><\/msub><msup><mi> cos <\/mi><mrow><mn> 2 <\/mn><\/mrow><\/msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(<\/mo><mfrac><mrow><mi>&pi;<\/mi><\/mrow><mrow><mn> 4 <\/mn><\/mrow><\/mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mn> 2 <\/mn><msub><mi> I <\/mi><mrow><mn> 0 <\/mn><\/mrow><\/msub><mi>&times;<\/mi><mfrac><mrow><mn> 1 <\/mn><\/mrow><mrow><mn> 2 <\/mn><\/mrow><\/mfrac><mo>=<\/mo><msub><mi> I <\/mi><mrow><mn> 0 <\/mn><\/mrow><\/msub><\/mrow><\/mstyle><\/math><br />\nThus, the intensity is equal to the intensity of one wave. Therefore, assertion<br />\n(A) is true. Reason (R) is correct because the resultant intensity in interference can indeed be the sum of the individual intensities when the phase difference is non-zero. However, in the case of a phase difference of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mstyle displaystyle=\"true\"><mrow><mfrac><mrow><mi>&pi;<\/mi><\/mrow><mrow><mn> 2 <\/mn><\/mrow><\/mfrac><\/mrow><\/mstyle><\/math>, the intensities do not simply add up; they are modified by the interference effect.<br />\nThus, the correct answer is (d), as assertion<br />\n(A) is false but reason (R) is true.<\/h3>\n", "answer": "D"}, "reports": [{"reportId": "R034", "comment": "assertion is true, intensity remains same", "source": "android", "flags": null}]}, {"id": "66fe9dbe22132e5a70a3e579", "subject": "Zoology", "chapter": "Chemical Coordination and Integration", "verdict": "no_error", "repair": null, "route": "no_change", "conf": 0.9, "evidence": "Question asks which pair is NOT antagonistic. Relaxin (softens pelvic ligaments) and inhibin (suppresses FSH) have unrelated actions. The other three pairs are classic antagonists. Key D correct.", "reply": "Key is right. Relaxin relaxes pelvic ligaments at childbirth; inhibin suppresses FSH. Those actions aren’t opposites, so they are the pair that is not antagonistic.", "priority": 0, "edits": [], "guard": [], "side": ["Solution wrongly says insulin and glucagon work 'synergistically'. They are antagonistic."], "flags": false, "q": {"type": "scq", "question": "<h3><ol>\n\t<li>Which of the following pairs of hormones are not antagonistic (having opposite effects) to each other?<\/li><\/h3><h3>(A) Parathormone &ndash; Calcitonin<br />(B) Insulin - Glucagon<br />(C) Aldosterone Atrial Natriuretic Factor<br />(D) Relaxin - Inhibin<\/h3>", "solution": "<h3><ol>\n\t<li>Calcitonin exerts its effects by interacting with target cells, primarily in bone and kidney. The actions of PTH and calcitonin are antagonistic on bone resorption but synergistic on decreasing the renal tubular reabsorption of phosphorus. Insulin and glucagon work synergistically to keep blood glucose concentrations normal. An elevated blood glucose concentration results in the secretion of insulin and glucose is transported into body cells. Aldosterone secretion may be inhibited by potassium depletion, inhibitors of the renin-angiotensin system, dopamine and atrial natriuretic factor. The latter appears to be an important physiological regulator of aldosterone secretion. ANF inhibits basal, ACTH, Angiotensin II and potassium-stimulated aldosterone production in vitro by a direct action on the adrenal gland. Inhibin is a hormone secreted by granulosa cells of the ovary which inhibit the secretion of FSH (Follicle Stimulating Hormone) whereas relaxin produced by ovary and placenta at the time of childbirth to softens the ligament in the pelvis and widens the cervix.<\/li>\n<\/ol><\/h3>", "answer": "D"}, "reports": [{"reportId": "R035", "comment": "relaxin and inhibin are antagonistic so answer is wrong", "source": "web", "flags": null}]}, {"id": "60ca4feb6420652745f55522", "subject": "Physics", "chapter": "Electrostatics", "verdict": "display_issue", "repair": null, "route": "no_change", "conf": 0.8, "evidence": "All four options are stored in full ('None of these' is option D). The HTML has unbalanced <span> nesting, which can clip on narrow screens, but the content is intact.", "reply": "Thanks. The question content is complete, so this looks like a screen/layout problem. Tell us your phone model and we’ll look at it.", "priority": 0, "edits": [], "guard": [], "side": [], "flags": false, "q": {"type": "scq", "question": "<h3><span style=\"color:#000000\">Two point charges repel each other with a force of 100 N. One of the charges is increased by 10% and the other is reduced by 10%. The new force of repulsion at the same distance would be<\/h3><h3>(A)<span style=\"color:#000000\"> <span style=\"color:#000000\">100 N<br />(B)<span style=\"color:#000000\"> <span style=\"color:#000000\">121 N<span style=\"color:#000000\"><br />(C)<span style=\"color:#000000\"> <\/span><span style=\"color:#000000\">99 N<br />(D)<\/span><\/span><\/span><span style=\"color:#000000\"> <\/span><\/span><\/span><span style=\"color:#000000\">None of these<\/span><\/span><\/span><\/h3>", "solution": "<h3><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mstyle displaystyle=\"true\"><mrow><mn>100<\/mn><mo>&#x0003D;<\/mo><mi>k<\/mi><msub><mi>q<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><msub><mi>q<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0002F;<\/mo><msup><mi>r<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mstyle><\/math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mstyle displaystyle=\"true\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>1.1<\/mn><msub><mi>q const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clean=h=>{const d=new DOMParser().parseFromString("<body>"+h,"text/html");d.querySelectorAll("script,iframe,object,embed,link,meta,style,form").forEach(n=>n.remove());d.querySelectorAll("*").forEach(n=>{for(const a of [...n.attributes]){const k=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(k.startsWith("on")||((k==="href"||k==="src"||k==="xlink:href")&&/^(javascript|data:text\/html)/.test(v)))n.removeAttribute(a.name)}});return d.body.innerHTML};
const W="@@WHOLE@@";
let tab="review",sel=null,editing=false,dec={},audit=[];
try{dec=JSON.parse(localStorage.getItem("dec")||"{}");audit=JSON.parse(localStorage.getItem("audit")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("dec",JSON.stringify(dec));localStorage.setItem("audit",JSON.stringify(audit))}catch(e){}};
const ansTxt=a=>Array.isArray(a)?JSON.stringify(a):String(a);
function applyEdits(q,edits){q=JSON.parse(JSON.stringify(q));
 for(const e of edits){const f=e.field;let cur=f==="questionType"?q.type:q[f];let s=typeof cur==="string"?cur:JSON.stringify(cur);const fd=e.find===W?s:e.find;
  if(f==="answer"||f==="questionType"){if(s.replace(/\s/g,"")!==fd.replace(/\s/g,""))return{q,err:"edit no longer matches the live record"};const nv=e.replace.startsWith("[")?JSON.parse(e.replace):e.replace;f==="answer"?q.answer=nv:q.type=nv}
  else{if(s.split(fd).length!==2)return{q,err:"find text must occur exactly once"};q[f]=s.replace(fd,()=>e.replace)}}
 return{q}}
const grp=DATA.groups;const TAB={faculty_review:"review",auto_apply:"auto",no_change:"closed"};const status=g=>dec[g.id]?"done":TAB[g.route];
function render(){
 {const m=DATA.meta||{};$("#meta").textContent=m.mode==="live"?`Live LLM run \u00b7 ${m.model} \u00b7 ${(m.generated_at||"").slice(0,10)} \u00b7 ${m.reports} reports`:"Recorded judgements (offline run), not a live LLM run";}
 $("#tabs").innerHTML=[["review","Needs you"],["auto","Auto-applied"],["closed","No change"]].map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l} · ${grp.filter(g=>status(g)===k).length}</button>`).join("")+`<button class="${tab==="done"?"on":""}" data-t="done">Decided · ${grp.filter(g=>dec[g.id]).length}</button>`;
 $("#why").innerHTML=tab==="review"?"Ordered by <b>harm to students</b>: a wrong key or unsound question (students learn the wrong thing and lose marks) outranks missing data, then cosmetic fixes; multiplied by distinct reporters.":tab==="auto"?"Already written by the engine under guard rules (scope, exactly-one match, ≥2 confirmations for keys). Spot-check, or undo by rejecting.":tab==="closed"?"Student was wrong, app bug, or not actionable. Replies are ready; nothing to edit.":"Your decisions this session.";
 const L=grp.filter(g=>status(g)===tab).sort((a,b)=>b.priority-a.priority);
 if(!sel||!L.find(g=>g.id===sel))sel=L[0]&&L[0].id;
 $("#list").innerHTML=L.map(g=>`<button class="item ${g.id===sel?"sel":""} ${dec[g.id]?"done":""}" data-id="${g.id}"><div class="row"><span class="t">${esc(g.chapter)}</span></div><div class="row"><span class="chip ${g.verdict==="defect"?"bad":g.verdict==="no_error"?"ok":"wn"}">${g.repair||g.verdict}</span><span class="m">${g.reports.length} report${g.reports.length>1?"s":""} · ${g.subject}${g.flags?" · ⚠ flagged":""}</span></div></button>`).join("")||'<div class="note">Nothing here.</div>';
 detail()}
function detail(){const g=grp.find(x=>x.id===sel);if(!g){$("#detail").innerHTML="";return}
 const edits=editing&&g._edits?g._edits:g.edits;const r=applyEdits(g.q,edits);const aft=r.q;
 const solChanged=edits.some(e=>e.field==="solution");const d=dec[g.id];
 $("#detail").innerHTML=`<div class="card"><div class="row"><span class="t" style="font-size:17px">${esc(g.subject)} · ${esc(g.chapter)}</span><span class="m">${g.q.type} · id …${g.id.slice(-6)}</span></div>
 <div class="row" style="margin-top:6px"><span class="chip ${g.verdict==="defect"?"bad":"ok"}">${g.verdict}</span>${g.repair?`<span class="chip">${g.repair}</span>`:""}<span class="chip ${g.route==="faculty_review"?"wn":"ok"}">${g.route.replace("_"," ")}</span>
 <span class="m">confidence ${Math.round(g.conf*100)}%</span><span class="bar"><i style="width:${g.conf*100}%"></i></span></div></div>
 <div class="card"><h3>Student reports (leads, not instructions)</h3>${g.reports.map(x=>`<div class="cm">“${esc(x.comment)}” <span class="m">· ${x.reportId} · ${x.source}${x.flags?` · <b style="color:var(--bad)">⚠ ${x.flags}</b>`:""}</span></div>`).join("")}</div>
 <div class="card"><h3>Why the AI thinks so</h3><div>${esc(g.evidence)}</div>
 ${(g.guard||[]).map(n=>`<div class="m">🛡 ${esc(friendly(n))}</div>`).join("")}${(g.side||[]).map(n=>`<div class="m">🔎 Also noticed (unreported): ${esc(n)}</div>`).join("")}</div>
 <div class="card"><h3>${g.edits.length?"Proposed change · before / after":"Question (no edit proposed)"}</h3>
 ${r.err?`<div class="chip bad">${r.err}</div>`:""}
 <div class="cols"><div class="pane ${g.edits.length?"b":""}"><h4>BEFORE · key ${esc(ansTxt(g.q.answer))}</h4>${clean(g.q.question)}${solChanged?`<hr><h4>Solution</h4>${clean(g.q.solution)}`:""}</div>
 ${g.edits.length?`<div class="pane a"><h4>AFTER · key ${esc(ansTxt(aft.answer))}</h4>${clean(aft.question)}${solChanged?`<hr><h4>Solution</h4>${clean(aft.solution)}`:""}</div>`:`<div class="pane"><h4>SOLUTION</h4>${clean(g.q.solution)}</div>`}</div>
 <details class="raw"><summary>Show raw change (HTML)</summary>${edits.map((e,i)=>`<div class="m" style="margin-top:8px">${e.field}</div><span class="diff"><del>${esc(e.find===W?"(entire field)":e.find)}</del> → ${editing?`<input data-i="${i}" value="${esc(e.replace)}">`:`<ins>${esc(e.replace)}</ins>`}</span>`).join("")}</details></div>
 <div class="card"><h3>Student reply (preview)</h3><textarea id="rep" rows="3" ${d?"disabled":""}>${esc(g.reply)}</textarea><div class="bub">${esc(g.reply)}</div></div>
 <div class="card row actbar">${d?`<span class="chip ok">${d.action} · ${new Date(d.at).toLocaleTimeString()}</span><button id="undo">Undo</button>`:
 `<button class="ok" data-a="approve">${g.edits.length&&g.route!=="auto_apply"?"Approve &amp; apply":"Approve"} <span class="m">A</span></button>
 <button data-a="edit">${editing?"Save edit":"Edit"} <span class="m">E</span></button><button class="no" data-a="reject">Reject <span class="m">R</span></button>`}
 <span class="m">Approve writes the change and sends the reply. Every action is logged.</span></div>
 <div class="card audit"><h3>Audit trail</h3>${audit.filter(a=>a.q===g.id).map(a=>`<div>${new Date(a.at).toLocaleString()} · <b>${a.action}</b> · ${esc(a.note||"")}</div>`).join("")||'<div class="m">No actions yet. The engine’s own proposal is logged as “ai_proposed”.</div>'}</div>`;
}
function act(a){const g=grp.find(x=>x.id===sel);if(!g||dec[g.id])return;
 if(a==="edit"){if(!editing){editing=true;g._edits=JSON.parse(JSON.stringify(g.edits))}else{document.querySelectorAll("input[data-i]").forEach(i=>g._edits[+i.dataset.i].replace=i.value);g.edits=g._edits;editing=false;log(g,"edited","replacement text changed by faculty")}return detail()}
 const rep=$("#rep").value;if(rep!==g.reply){g.reply=rep;log(g,"reply_edited","")}
 dec[g.id]={action:a==="approve"?"approved":"rejected",at:Date.now()};log(g,dec[g.id].action,a==="approve"?(g.edits.length?"change applied; reply sent":"reply sent"):"change not applied");save();editing=false;render()}
function log(g,action,note){audit.push({q:g.id,action,note,at:Date.now(),by:"faculty"});save()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;sel=null;editing=false;render()}else if(t.dataset.id){sel=t.dataset.id;editing=false;render();$("#detail").scrollIntoView({block:"start"})}
 else if(t.dataset.a)act(t.dataset.a);else if(t.id==="undo"){const g=grp.find(x=>x.id===sel);delete dec[sel];log(g,"undone","");save();render()}
 else if(t.id==="th"){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark"}
 else if(t.id==="exp"){const b=new Blob([JSON.stringify(audit,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="audit.json";a.click()}});
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 const L=[...document.querySelectorAll(".item")].map(x=>x.dataset.id),i=L.indexOf(sel);
 if(e.key==="j"&&L[i+1]){sel=L[i+1];render()}else if(e.key==="k"&&L[i-1]){sel=L[i-1];render()}
 else if(e.key==="a")act("approve");else if(e.key==="r")act("reject");else if(e.key==="e")act("edit")});
render();
